id = "stags/openaten"
name = "OpenATEN"
version = "0.2.0"
plugin_api = 9
author = "stags"
description = "Status and on/off toggle for OpenATEN keyboard/mouse forwarding over an ATEN USB switch"
tags = ["Bar"]
icon = "keyboard"

[[widget]]
id = "widget"
entry = "openaten.luau"

  [[widget.setting]]
  key = "openaten_path"
  type = "string"
  label_key = "settings.openaten_path.label"
  description_key = "settings.openaten_path.description"
  default = "~/.local/bin/openaten"
