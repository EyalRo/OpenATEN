name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          pip install -e .
          test "v$(python -c 'import openaten; print(openaten.__version__)')" = "${GITHUB_REF_NAME}"
      - run: pip install -e ".[dev]" build
      - run: ruff check . && mypy && pytest -q
      - run: python -m build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
