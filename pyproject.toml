[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openaten"
version = "0.1.0"
description = "Open tooling for the host-to-host bridge in ATEN US3342-class USB-C sharing switches (experimental)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyusb>=1.2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
openaten = "openaten.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
