[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openaten"
version = "0.1.0"
description = "Open tooling for the host-to-host bridge in ATEN US3342-class USB-C sharing switches (experimental)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = ["pyusb>=1.2", "tomli>=2; python_version < \"3.11\""]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy"]
forward = ["evdev"]

[project.urls]
Homepage = "https://github.com/EyalRo/OpenATEN"
Issues = "https://github.com/EyalRo/OpenATEN/issues"
Changelog = "https://github.com/EyalRo/OpenATEN/blob/main/CHANGELOG.md"

[project.scripts]
openaten = "openaten.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hardware'"  # real-switch tests only run on request: pytest -m hardware
markers = ["hardware: needs an ATEN switch with both upstream ports connected to this machine (see docs/hardware.md)"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 160
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long lines are the house style (formatter not enforced); B905/B023/E731: zip lengths are equal by construction, closures are intentional
ignore = ["E501", "B905", "B023", "E731"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["openaten"]
branch = true

[tool.coverage.report]
fail_under = 75  # hardware-bound modules (usb, selftest, strip) are mostly untestable in CI; raise as coverage grows
