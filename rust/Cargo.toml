[package]
name = "openaten-core"
version = "0.2.1"
edition = "2021"
description = "Open tooling for the host-to-host bridge in ATEN US3342-class USB-C sharing switches (core daemon + CLI)"
license = "MIT"

[lib]
name = "openaten_core"
path = "src/lib.rs"

[[bin]]
name = "openaten"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
crc32fast = "1"
getrandom = "0.2"
libc = "0.2"

[profile.release]
lto = true
strip = true
